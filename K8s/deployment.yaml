apiVersion: apps/v1
kind: Deployment
metadata:
  name: loginapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loginapp
  template:
    metadata:
      labels:
        app: loginapp
    spec:
      containers:
        - name: loginapp
          image: pritahegde/loginapp:latest
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
